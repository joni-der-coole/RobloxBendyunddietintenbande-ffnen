<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bendy and the Ink Machine</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">

    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 25px;
            background: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #00b06f;
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #00965d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bendy and the Ink Machine</h1>
        <p>Klicke auf den Button, um das Spiel zu öffnen:</p>
        
        <a class="btn" href="https://www.roblox.com/de/games/4850588087/Bendy-and-the-ink-Machine" target="_blank" rel="noopener noreferrer">Spiel öffnen</a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html></html>
