<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gitterpen - Minecraftia Projekt</title>
    <style>
        /* Einbindung der Minecraftia-Regular.ttf Schriftart */
        @font-face {
            font-family: 'Minecraftia';
            src: url('Minecraftia-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Minecraftia', monospace;
            background-color: #1b1b1b;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 40px;
            /* Sorgt dafür, dass Pixel-Schriftarten scharf und ohne Weichzeichnung gerendert werden */
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #2d2d2d;
            border: 4px solid #3c3c3c;
            padding: 30px;
            box-shadow: 0 8px 0px #111111;
        }

        h1 {
            font-size: 24px;
            color: #55ff55; /* Klassisches Minecraft-Grün */
            text-shadow: 2px 2px #000000;
            margin-bottom: 20px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #dddddd;
        }

        .box {
            margin-top: 20px;
            background: #1e1e1e;
            border: 2px solid #555555;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gitterpen</h1>
        <p>Deine Schriftart <strong>Minecraftia-Regular.ttf</strong> wurde erfolgreich für das Projekt eingerichtet!</p>
        
        <div class="box">
          <p>Hier kannst du deinen Text oder dein eingebettetes Skript platzieren.</p>
        </div>
    </div>

</body>
</html>
